<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; padding:20px; background:#e5e7eb; font-family:'Segoe UI',Arial,sans-serif; }
</style></head><body>

<!-- ============ BANNIÈRE 468x60 (v2 améliorée) ============ -->
<div style="width:468px;height:60px;position:relative;overflow:hidden;border-radius:10px;
            background:linear-gradient(100deg,#12296b 0%,#1d4ed8 32%,#2563eb 55%,#f59e0b 85%,#fb923c 100%);
            box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;
            padding:0 11px;box-sizing:border-box;">

  <div style="position:absolute;inset:0;opacity:.07;background-image:
              linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
              background-size:18px 18px;"></div>

  <!-- Logo -->
  <div style="width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.97);
              display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:2;
              box-shadow:0 2px 6px rgba(0,0,0,.25);">
    <img src="/media/wintaskly/img/logo-dark-64.png" width="20" height="20" alt="Wintaskly">
  </div>

  <!-- Message -->
  <div style="flex:1;z-index:2;min-width:0;margin-left:9px;">
    <div style="color:#fff;font-size:12.5px;font-weight:800;line-height:1.15;white-space:nowrap;
                text-shadow:0 1px 2px rgba(0,0,0,.25);">
      Wintaskly — Gagne des Coins en 3 clics
    </div>
    <div style="color:rgba(255,255,255,.88);font-size:9px;font-weight:600;white-space:nowrap;">
      Faucet · Liens · Offres · Parrainage 10%
    </div>
  </div>

  <!-- CTA -->
  <a href="#" style="flex-shrink:0;z-index:2;background:linear-gradient(135deg,#fbbf24,#ea580c);color:#fff;
                      font-size:11px;font-weight:800;padding:7px 14px;border-radius:18px;text-decoration:none;
                      white-space:nowrap;box-shadow:0 2px 7px rgba(234,88,12,.55);">
    Essayer →
  </a>
</div>

<p style="font-family:sans-serif;color:#666;margin-top:10px;">468×60 — v2</p>
</body></html>
