<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; padding:20px; background:#e5e7eb; font-family:'Segoe UI',Arial,sans-serif; }
</style></head><body>

<!-- ============ BANNIÈRE 300x250 ============ -->
<div style="width:300px;height:250px;position:relative;overflow:hidden;border-radius:12px;
            background:linear-gradient(160deg,#1e40af 0%,#1d4ed8 30%,#3b82f6 52%,#f59e0b 78%,#fb923c 100%);
            box-shadow:0 4px 16px rgba(0,0,0,.25);box-sizing:border-box;
            padding:16px;display:flex;flex-direction:column;">

  <!-- Formes décoratives -->
  <div style="position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;
              background:rgba(255,255,255,.08);"></div>
  <div style="position:absolute;bottom:40px;left:-40px;width:110px;height:110px;border-radius:50%;
              background:rgba(255,255,255,.06);"></div>

  <!-- Logo + nom -->
  <div style="display:flex;align-items:center;gap:8px;z-index:2;margin-bottom:10px;">
    <div style="width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.95);
                display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <img src="/media/wintaskly/img/logo-dark-64.png" width="22" height="22" alt="Wintaskly">
    </div>
    <strong style="color:#fff;font-size:17px;font-weight:800;letter-spacing:-.3px;
                    text-shadow:0 1px 3px rgba(0,0,0,.2);">Wintaskly</strong>
  </div>

  <!-- Titre -->
  <div style="color:#fff;font-size:19px;font-weight:800;line-height:1.2;z-index:2;
              text-shadow:0 1px 3px rgba(0,0,0,.2);margin-bottom:10px;">
    Gagne en ligne<br>facilement
  </div>

  <!-- Liste des 4 sources -->
  <div style="z-index:2;display:flex;flex-direction:column;gap:6px;flex:1;">
    <div style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);
                border-radius:7px;padding:5px 9px;">
      <span style="font-size:14px;">💧</span>
      <span style="color:#fff;font-size:11.5px;font-weight:700;">Faucet toutes les 3h</span>
    </div>
    <div style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);
                border-radius:7px;padding:5px 9px;">
      <span style="font-size:14px;">🔗</span>
      <span style="color:#fff;font-size:11.5px;font-weight:700;">Liens rémunérés</span>
    </div>
    <div style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);
                border-radius:7px;padding:5px 9px;">
      <span style="font-size:14px;">🎯</span>
      <span style="color:#fff;font-size:11.5px;font-weight:700;">Offres & vidéos</span>
    </div>
    <div style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);
                border-radius:7px;padding:5px 9px;">
      <span style="font-size:14px;">👥</span>
      <span style="color:#fff;font-size:11.5px;font-weight:700;">Parrainage 10% à vie</span>
    </div>
  </div>

  <!-- CTA -->
  <a href="#" style="z-index:2;background:#ea580c;color:#fff;font-size:13.5px;font-weight:800;
                      padding:11px;border-radius:9px;text-decoration:none;text-align:center;
                      box-shadow:0 3px 10px rgba(234,88,12,.5);margin-top:10px;letter-spacing:.2px;">
    S'INSCRIRE GRATUITEMENT
  </a>
  <div style="text-align:center;color:rgba(255,255,255,.85);font-size:10px;font-weight:600;margin-top:5px;z-index:2;">
    100% gratuit · Aucun engagement
  </div>
</div>

<p style="font-family:sans-serif;color:#666;margin-top:10px;">300×250 — medium rectangle</p>
</body></html>
