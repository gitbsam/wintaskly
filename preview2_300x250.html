<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; padding:20px; background:#e5e7eb; font-family:'Segoe UI',Arial,sans-serif; }
  .coin { filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
</style></head><body>

<!-- ============ BANNIÈRE 300x250 (v2 améliorée) ============ -->
<div style="width:300px;height:250px;position:relative;overflow:hidden;border-radius:14px;
            background:linear-gradient(160deg,#12296b 0%,#1d4ed8 32%,#2563eb 52%,#f59e0b 80%,#fb923c 100%);
            box-shadow:0 6px 20px rgba(0,0,0,.3);box-sizing:border-box;
            padding:14px;display:flex;flex-direction:column;">

  <div style="position:absolute;inset:0;opacity:.07;background-image:
              linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
              background-size:20px 20px;"></div>
  <div style="position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;
              background:rgba(255,255,255,.07);"></div>

  <!-- Logo -->
  <div style="display:flex;align-items:center;gap:7px;z-index:2;margin-bottom:8px;">
    <div style="width:28px;height:28px;border-radius:7px;background:rgba(255,255,255,.97);
                display:flex;align-items:center;justify-content:center;flex-shrink:0;
                box-shadow:0 2px 6px rgba(0,0,0,.25);">
      <img src="/media/wintaskly/img/logo-dark-64.png" width="19" height="19" alt="Wintaskly">
    </div>
    <div>
      <div style="color:#fff;font-size:14.5px;font-weight:800;line-height:1;letter-spacing:-.3px;
                  text-shadow:0 1px 3px rgba(0,0,0,.25);">Wintaskly</div>
      <div style="color:rgba(255,255,255,.7);font-size:7px;font-weight:700;letter-spacing:.5px;">GPT PLATFORM</div>
    </div>
  </div>

  <!-- Titre -->
  <div style="color:#fff;font-size:16.5px;font-weight:800;line-height:1.18;z-index:2;
              text-shadow:0 1px 3px rgba(0,0,0,.25);margin-bottom:9px;">
    Transforme ton temps en récompenses
  </div>

  <!-- Mockup carte app -->
  <div style="z-index:2;background:rgba(255,255,255,.95);border-radius:9px;padding:9px 10px;
              box-shadow:0 4px 14px rgba(0,0,0,.25);margin-bottom:9px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
      <span style="color:#64748b;font-size:9px;font-weight:700;">SOLDE ACTUEL</span>
      <div style="display:flex;align-items:center;gap:3px;">
        <svg width="12" height="12" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="url(#g2)"/><defs><linearGradient id="g2" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#ffd873"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><text x="12" y="16" font-size="11" font-weight="800" fill="#7a4a00" text-anchor="middle">W</text></svg>
        <strong style="color:#0f172a;font-size:13px;">1 250,50</strong>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid #eef2f7;">
      <span style="color:#334155;font-size:9.5px;font-weight:600;">💧 Faucet</span>
      <span style="color:#16a34a;font-size:9.5px;font-weight:800;">+25</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid #eef2f7;">
      <span style="color:#334155;font-size:9.5px;font-weight:600;">🔗 Shortlink</span>
      <span style="color:#16a34a;font-size:9.5px;font-weight:800;">+8</span>
    </div>
    <div style="display:flex;justify-content:space-between;padding:3px 0;border-top:1px solid #eef2f7;">
      <span style="color:#334155;font-size:9.5px;font-weight:600;">👥 Parrainage</span>
      <span style="color:#16a34a;font-size:9.5px;font-weight:800;">+120</span>
    </div>
  </div>

  <!-- CTA -->
  <a href="#" style="z-index:2;background:linear-gradient(135deg,#fbbf24,#ea580c);color:#fff;font-size:13.5px;
                      font-weight:800;padding:10px;border-radius:22px;text-decoration:none;text-align:center;
                      box-shadow:0 3px 10px rgba(234,88,12,.55);letter-spacing:.2px;">
    COMMENCER MAINTENANT →
  </a>
  <div style="text-align:center;color:rgba(255,255,255,.85);font-size:9px;font-weight:600;margin-top:4px;z-index:2;">
    Inscription rapide et gratuite
  </div>
</div>

<p style="font-family:sans-serif;color:#666;margin-top:10px;">300×250 — v2</p>
</body></html>
