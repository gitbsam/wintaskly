<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; padding:20px; background:#e5e7eb; font-family:'Segoe UI',Arial,sans-serif; }
  .coin { filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
</style></head><body>

<!-- ============ BANNIÈRE 728x90 (v2 améliorée) ============ -->
<div style="width:728px;height:90px;position:relative;overflow:hidden;border-radius:12px;
            background:linear-gradient(115deg,#12296b 0%,#1d4ed8 35%,#2563eb 55%,#f59e0b 85%,#fb923c 100%);
            box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;align-items:center;
            padding:0 16px;box-sizing:border-box;">

  <!-- Formes décoratives + grille tech légère -->
  <div style="position:absolute;inset:0;opacity:.08;background-image:
              linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
              background-size:24px 24px;"></div>
  <div style="position:absolute;top:-45px;left:180px;width:140px;height:140px;border-radius:50%;
              background:rgba(255,255,255,.07);"></div>

  <!-- Logo + marque -->
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:2;">
    <div style="width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.97);
                display:flex;align-items:center;justify-content:center;flex-shrink:0;
                box-shadow:0 2px 8px rgba(0,0,0,.25);">
      <img src="/media/wintaskly/img/logo-dark-64.png" width="26" height="26" alt="Wintaskly">
    </div>
    <div>
      <div style="color:#fff;font-size:15px;font-weight:800;line-height:1;letter-spacing:-.3px;
                  text-shadow:0 1px 3px rgba(0,0,0,.25);">Wintaskly</div>
      <div style="color:rgba(255,255,255,.75);font-size:8px;font-weight:700;letter-spacing:.6px;margin-top:2px;">GPT PLATFORM</div>
    </div>
  </div>

  <!-- Message -->
  <div style="flex:1;z-index:2;min-width:0;margin-left:18px;">
    <div style="color:#fff;font-size:17px;font-weight:800;line-height:1.1;white-space:nowrap;
                text-shadow:0 1px 3px rgba(0,0,0,.25);">
      Transforme ton temps en récompenses
    </div>
    <div style="color:rgba(255,255,255,.92);font-size:11px;font-weight:600;margin-top:3px;white-space:nowrap;">
      Faucet · Liens · Offres · Parrainage 10% à vie
    </div>
  </div>

  <!-- Mini mockup carte (solde) -->
  <div style="flex-shrink:0;z-index:2;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);
              border-radius:9px;padding:6px 12px;margin-right:14px;backdrop-filter:blur(2px);">
    <div style="color:rgba(255,255,255,.75);font-size:8px;font-weight:700;">SOLDE</div>
    <div style="display:flex;align-items:center;gap:4px;">
      <svg class="coin" width="13" height="13" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="url(#g1)"/><defs><linearGradient id="g1" x1="0" y1="0" x2="24" y2="24"><stop offset="0" stop-color="#ffd873"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs><text x="12" y="16" font-size="12" font-weight="800" fill="#7a4a00" text-anchor="middle">W</text></svg>
      <span style="color:#fff;font-size:13px;font-weight:800;">1 250</span>
    </div>
  </div>

  <!-- CTA -->
  <a href="#" style="flex-shrink:0;z-index:2;background:linear-gradient(135deg,#fbbf24,#ea580c);color:#fff;
                      font-size:13px;font-weight:800;padding:11px 20px;border-radius:24px;text-decoration:none;
                      white-space:nowrap;box-shadow:0 3px 10px rgba(234,88,12,.55);letter-spacing:.2px;">
    COMMENCER →
  </a>
</div>

<p style="font-family:sans-serif;color:#666;margin-top:10px;">728×90 — v2</p>
</body></html>
