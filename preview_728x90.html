<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; padding:20px; background:#e5e7eb; font-family:'Segoe UI',Arial,sans-serif; }
</style></head><body>

<!-- ============ BANNIÈRE 728x90 ============ -->
<div style="width:728px;height:90px;position:relative;overflow:hidden;border-radius:10px;
            background:linear-gradient(115deg,#1e40af 0%,#1d4ed8 38%,#3b82f6 55%,#f59e0b 82%,#fb923c 100%);
            box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;
            padding:0 18px;box-sizing:border-box;">

  <!-- Formes décoratives -->
  <div style="position:absolute;top:-40px;left:120px;width:130px;height:130px;border-radius:50%;
              background:rgba(255,255,255,.08);"></div>
  <div style="position:absolute;bottom:-50px;right:180px;width:150px;height:150px;border-radius:50%;
              background:rgba(255,255,255,.06);"></div>

  <!-- Logo + nom -->
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:2;">
    <div style="width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.95);
                display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <img src="/media/wintaskly/img/logo-dark-64.png" width="24" height="24" alt="Wintaskly">
    </div>
    <strong style="color:#fff;font-size:16px;font-weight:800;letter-spacing:-.3px;
                    text-shadow:0 1px 3px rgba(0,0,0,.2);">Wintaskly</strong>
  </div>

  <!-- Séparateur -->
  <div style="width:1px;height:38px;background:rgba(255,255,255,.3);margin:0 16px;flex-shrink:0;z-index:2;"></div>

  <!-- Message -->
  <div style="flex:1;z-index:2;min-width:0;">
    <div style="color:#fff;font-size:16px;font-weight:800;line-height:1.15;
                text-shadow:0 1px 3px rgba(0,0,0,.2);white-space:nowrap;">
      Gagne de l'argent en accomplissant des micro-tâches
    </div>
    <div style="color:rgba(255,255,255,.92);font-size:11.5px;font-weight:600;margin-top:3px;white-space:nowrap;">
      💧 Faucet · 🔗 Liens · 🎯 Offres · 👥 Parrainage 10% à vie
    </div>
  </div>

  <!-- CTA -->
  <a href="#" style="flex-shrink:0;z-index:2;background:#ea580c;color:#fff;font-size:13px;font-weight:800;
                      padding:11px 20px;border-radius:9px;text-decoration:none;white-space:nowrap;
                      box-shadow:0 3px 10px rgba(234,88,12,.5);letter-spacing:.2px;">
    S'INSCRIRE GRATUIT →
  </a>
</div>

<p style="font-family:sans-serif;color:#666;margin-top:10px;">728×90 — leaderboard</p>
</body></html>
