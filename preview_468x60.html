<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; padding:20px; background:#e5e7eb; font-family:'Segoe UI',Arial,sans-serif; }
</style></head><body>

<!-- ============ BANNIÈRE 468x60 ============ -->
<div style="width:468px;height:60px;position:relative;overflow:hidden;border-radius:8px;
            background:linear-gradient(100deg,#1e40af 0%,#1d4ed8 35%,#3b82f6 58%,#f59e0b 85%,#fb923c 100%);
            box-shadow:0 3px 12px rgba(0,0,0,.25);display:flex;align-items:center;
            padding:0 12px;box-sizing:border-box;">

  <div style="position:absolute;top:-25px;left:100px;width:80px;height:80px;border-radius:50%;
              background:rgba(255,255,255,.07);"></div>

  <!-- Logo -->
  <div style="width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.95);
              display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:2;">
    <img src="/media/wintaskly/img/logo-dark-32.png" width="18" height="18" alt="Wintaskly">
  </div>

  <!-- Message -->
  <div style="flex:1;z-index:2;min-width:0;margin-left:9px;">
    <div style="color:#fff;font-size:12.5px;font-weight:800;line-height:1.15;white-space:nowrap;
                text-shadow:0 1px 2px rgba(0,0,0,.2);">
      Wintaskly — Gagne des Coins en 3 clics
    </div>
    <div style="color:rgba(255,255,255,.9);font-size:9.5px;font-weight:600;white-space:nowrap;">
      Faucet · Liens · Offres · Parrainage
    </div>
  </div>

  <!-- CTA -->
  <a href="#" style="flex-shrink:0;z-index:2;background:#ea580c;color:#fff;font-size:11px;font-weight:800;
                      padding:7px 13px;border-radius:7px;text-decoration:none;white-space:nowrap;
                      box-shadow:0 2px 6px rgba(234,88,12,.5);">
    Essayer →
  </a>
</div>

<p style="font-family:sans-serif;color:#666;margin-top:10px;">468×60 — full banner</p>
</body></html>
